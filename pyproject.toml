[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-task-graph-agent"
version = "0.1.0"
description = "Evidence-aware daily task graph engine"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
task-graph = "task_graph_agent.cli:main"
